name: Venture #1 CI Pipeline

on:
  push:
    branches: [ main, production ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ventures/001-fba-2d-studio/package.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Venture Dependencies
        run: |
          cd ventures/001-fba-2d-studio
          npm ci

      - name: Verify Cryptographic Test Suite Integrity
        run: |
          cd ventures/001-fba-2d-studio
          ./scripts/verify_protected_integrity.sh

      - name: Run Protected Invariant Tests
        run: |
          cd ventures/001-fba-2d-studio
          npx vitest run tests/protected/

      - name: Build Static Distribution (Vite Bundling)
        run: |
          cd ventures/001-fba-2d-studio
          npm run build

      - name: Live-DOM Verification Gate
        run: |
          pip install playwright
          playwright install --with-deps chromium
          cd ventures/001-fba-2d-studio
          python tests/live_dom_verify.py
